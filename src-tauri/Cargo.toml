[package]
name = "manzar"
version = "0.1.4"
description = "A local image viewer built with Tauri and React"
authors = ["Manzar contributors"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "manzar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Capabilities are resolved at build time; runtime ACL mutation is unused.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
tauri-plugin-dialog = "2"
trash = "5"
fast_image_resize = "6"
jpeg-decoder = "0.3"

tempfile = "3"

[profile.release]
# One codegen unit plus cross-crate LTO: a smaller binary pages in faster on
# launch, which is most of a desktop viewer's startup cost.
codegen-units = 1
lto = true
strip = "symbols"

# Keep image processing at level 3; optimize UI/runtime glue for size.
[profile.release.package]
tauri = { opt-level = "z" }
tauri-runtime = { opt-level = "z" }
tauri-runtime-wry = { opt-level = "z" }
wry = { opt-level = "z" }
tao = { opt-level = "z" }
gtk = { opt-level = "z" }
glib = { opt-level = "z" }
gio = { opt-level = "z" }
webkit2gtk = { opt-level = "z" }
tokio = { opt-level = "z" }
